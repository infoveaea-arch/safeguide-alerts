name: SafeGuide drug alerts

# Runs the VPTS drug-notification scraper in GitHub's cloud (independent of any
# local machine) and deploys alerts.json to IONOS only when it changes.
#
# Every successful run ALSO uploads alerts/status.json (a heartbeat: when the check
# last ran and the newest alert date), whether or not the feed changed. The page keys
# its "feed has stalled" banner off that file, not off alerts.json's generated_at,
# because generated_at only moves when VPTS publishes (they go 2-4 weeks between
# notices) and would otherwise raise a false alarm most of the time.
#
# Requires ONE repository secret:
#   SFTP_KEY  — the dedicated CI SSH *private* key (ed25519). Its public half is
#               registered under IONOS → SSH access for user a2629167.
#
# The scraper is stdlib-only Python + the `pdftotext` CLI (poppler-utils).
# See alerts/fetch_notifications.py and alerts/run.sh.

on:
  schedule:
    # VPTS posts irregularly; check twice daily. Times are UTC.
    # 22:15 UTC ≈ 08:15/09:15 Melbourne, 10:15 UTC ≈ 20:15/21:15 Melbourne.
    - cron: "15 22 * * *"
    - cron: "15 10 * * *"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: safeguide-alerts
  cancel-in-progress: false

permissions:
  contents: write   # to commit the refreshed alerts.json back to the repo

env:
  SFTP_HOST: access-5020258978.webspace-host.com
  SFTP_USER: a2629167
  SFTP_PORT: "22"
  REMOTE: /app/harm-reduction/alerts/alerts.json
  REMOTE_STATUS: /app/harm-reduction/alerts/status.json
  LOCAL: staging-site/alerts/alerts.json
  PUBLIC_URL: https://app.veaea.org/harm-reduction/alerts/alerts.json
  PUBLIC_STATUS_URL: https://app.veaea.org/harm-reduction/alerts/status.json

jobs:
  scrape-and-deploy:
    # A hung SFTP or scraper must not hold a runner for the 6h default.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (poppler-utils, lftp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils lftp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Persist the PDF text cache between runs so we don't re-download every PDF.
      - name: Restore PDF cache
        uses: actions/cache@v4
        with:
          path: alerts/.state
          key: vpts-pdf-cache

      - name: Run scraper
        run: python3 alerts/fetch_notifications.py

      # Written to RUNNER_TEMP, never into the repo, so it is not committed and does
      # not add a commit to the audit trail every 12 hours.
      - name: Write heartbeat
        run: python3 alerts/heartbeat.py "$LOCAL" "$RUNNER_TEMP/status.json" vpts

      - name: Detect change
        id: diff
        run: |
          # NOTE: use `git status --porcelain`, NOT `git diff`. `git diff` only sees
          # TRACKED files — if the feed file is missing (first run, or it was removed)
          # the fetcher recreates it as UNTRACKED, `git diff` reports no change, and the
          # deploy silently never fires. This exact failure mode already hit the sibling
          # alerts-multi.yml pipeline ("a run went green having done nothing while prod
          # stayed frozen") and was fixed there; porting the same fix here since this is
          # the pipeline that actually serves production. --porcelain catches both '??'
          # (new) and ' M' (modified).
          if [ -n "$(git status --porcelain -- "$LOCAL")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$LOCAL changed:"
            git status --porcelain -- "$LOCAL"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in $LOCAL"
          fi
          # Self-heal: also redeploy the feed when prod no longer serves it (deleted,
          # or never deployed), even though the content is unchanged.
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" --max-time 20 \
                   "${PUBLIC_URL}?probe=${GITHUB_RUN_ID}" || true)
          echo "prod feed probe → HTTP $code"
          if [ "$code" != "200" ] || [ -n "$(git status --porcelain -- "$LOCAL")" ]; then
            echo "deploy_feed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_feed=false" >> "$GITHUB_OUTPUT"
          fi

      # Runs every time: the heartbeat always goes up, the feed only when needed.
      # The feed is put FIRST so the heartbeat can never claim a check that did not
      # land. `cmd:fail-exit` matters: without it lftp exits 0 after a failed put
      # in the middle of the batch (only the last command sets the exit code), and
      # the run goes green having deployed nothing.
      - name: Deploy to IONOS
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          DEPLOY_FEED: ${{ steps.diff.outputs.deploy_feed }}
        run: |
          # Fail fast: an empty secret would write an empty key and then hang or fail
          # obscurely inside lftp. The key reaches the shell as an env var, never
          # spliced into the script text.
          if [ -z "$SFTP_KEY" ]; then
            echo "::error::SFTP_KEY repository secret is empty or missing"
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          FEED_CMDS=""
          if [ "$DEPLOY_FEED" = "true" ]; then
            FEED_CMDS="put \"$LOCAL\" -o \"$REMOTE\"; chmod 644 \"$REMOTE\";"
          fi
          # OPERATIONS.md §2.1 — IONOS uploads land 0700 → 403; chmod 644 after put.
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2; set net:timeout 20;
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -i ~/.ssh/ci_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes';
            open -u \"$SFTP_USER,\" sftp://$SFTP_HOST:$SFTP_PORT;
            $FEED_CMDS
            put \"$RUNNER_TEMP/status.json\" -o \"$REMOTE_STATUS\";
            chmod 644 \"$REMOTE_STATUS\";
            bye
          "
          rm -f ~/.ssh/ci_key

      - name: Verify live URL
        if: steps.diff.outputs.deploy_feed == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" --max-time 20 \
                   "${PUBLIC_URL}?bust=${GITHUB_RUN_ID}")
          echo "$PUBLIC_URL → HTTP $code"
          [ "$code" = "200" ] || { echo "::error::live verify failed (expected 200)"; exit 1; }

      - name: Verify live heartbeat
        run: |
          want=$(python3 -c "import json,os;print(json.load(open(os.environ['RUNNER_TEMP']+'/status.json'))['checked_at'])")
          got=$(curl -s -A "Mozilla/5.0" --max-time 20 "${PUBLIC_STATUS_URL}?bust=${GITHUB_RUN_ID}" \
                  | python3 -c "import json,sys;print(json.load(sys.stdin).get('checked_at'))" || true)
          echo "heartbeat: wrote $want, live serves $got"
          [ "$want" = "$got" ] || { echo "::error::live heartbeat does not match what was uploaded"; exit 1; }

      - name: Commit refreshed alerts.json (audit trail)
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "safeguide-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$LOCAL"
          git commit -m "chore(alerts): refresh VPTS drug notifications [skip ci]"
          git push
